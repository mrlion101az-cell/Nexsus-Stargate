  dhd-placed: "&6Dialing device linked to &e{name}&6. This gate's address is &f{address}&6."
  dhd-no-gate: "&cNo complete gate within {range} blocks. &7/stargate blueprint shows how to build one."
  dhd-blocked: "&cThe gate nearby has something in its opening. Clear it first."
  gate-limit: "&cYou already own {n} gates."
  gate-broken: "&cThis gate is damaged and no longer works."
  gate-removed: "&7The gate {name} has fallen silent for good."
  dial-busy: "&cThis gate is already in use."
  dial-far-busy: "&cChevron 7 will not lock. The far gate is busy."
  dial-unknown: "&cChevron 7 will not lock. Nothing answers at that address."
  dial-not-known: "&cYou do not know that address."
