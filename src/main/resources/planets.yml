# The planets that come with NexusStargate. Each becomes its own world (sg_<id>) with a gate and a dialing device
# on a platform at its middle. Do not edit this file (a plugin update replaces it): put your changes in
# custom-planets.yml.
#
# style    one of desert, forest, moor, ice, jungle, ash (what the land looks like)
# starter  true: everyone knows its address from the start. false: learned from a tablet, staff or another plugin.
# mobs     false: nothing spawns on it
planets:
  abydos:
    name: "Abydos"
    designation: "Desert world, dunes and a buried pyramid"
    style: desert
    seed: 40210
    starter: true
    mobs: false
    blurb: "Sand to the horizon and a pyramid older than the gate that stands beside it."
  chulak:
    name: "Chulak"
    designation: "Cold forest world, stone fortresses"
    style: forest
    seed: 71033
    starter: true
    time: 12500
    blurb: "Spruce forest under a low sky, with fortresses of dark stone."
  p3x-118:
    name: "P3X-118"
    designation: "Jungle world, overgrown ruins"
    style: jungle
    seed: 11874
    starter: true
    blurb: "Humid jungle swallowing temples that nobody remembers building."
  p4x-884:
    name: "P4X-884"
    designation: "Windswept moor, standing stones"
    style: moor
    seed: 88412
    starter: true
    blurb: "Open moor, low cloud and rings of standing stones."
  cimmeria:
    name: "Cimmeria"
    designation: "Frozen world, protected"
    style: ice
    seed: 30519
    starter: false
    time: 18000
    blurb: "A snowbound world under permanent storm. Something old is watching over it."
  netu:
    name: "Netu"
    designation: "Volcanic ash world"
    style: ash
    seed: 66613
    starter: false
    blurb: "Black basalt, lava seas and fortresses built to last."
